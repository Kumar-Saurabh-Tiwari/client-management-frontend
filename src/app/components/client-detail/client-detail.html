<main class="container py-4">
  <button class="btn btn-outline-secondary mb-3" (click)="goBackToDashboard()">Back to Clients</button>

  <div *ngIf="isLoading && !client" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">{{ errorMessage }}</div>

  <section *ngIf="!isLoading && client && !editMode" class="detail-card">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
      <div>
        <h2 class="mb-1">{{ client.name }}</h2>
        <p class="text-muted mb-0">{{ client.email }}</p>
      </div>
      <div class="action-buttons">
        <button class="btn btn-outline-primary" (click)="toggleEditMode()">Edit</button>
        <button class="btn btn-outline-danger" (click)="confirmDelete()">Delete</button>
      </div>
    </div>

    <hr />
    <p><strong>Summary:</strong> {{ client.summary }}</p>
    <p><strong>Objectives:</strong> {{ client.objectives }}</p>
    <p><strong>Timeline:</strong> {{ client.timeline }}</p>
    <p><strong>Budget:</strong> {{ client.budget }}</p>
    <p class="small text-muted mb-0">Updated: {{ updatedDate }}</p>
  </section>

  <section *ngIf="!isLoading && client && editMode" class="detail-card">
    <h3 class="mb-3">Edit Client</h3>
    <form [formGroup]="editForm" (ngSubmit)="saveChanges()" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="editName">Name</label>
          <input id="editName" type="text" class="form-control" formControlName="name" />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="editEmail">Email</label>
          <input id="editEmail" type="email" class="form-control" formControlName="email" />
        </div>
        <div class="col-12">
          <label class="form-label" for="editSummary">Summary</label>
          <input id="editSummary" type="text" class="form-control" formControlName="summary" />
        </div>
        <div class="col-12">
          <label class="form-label" for="editObjectives">Objectives</label>
          <textarea id="editObjectives" rows="4" class="form-control" formControlName="objectives"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="editTimeline">Timeline</label>
          <input id="editTimeline" type="text" class="form-control" formControlName="timeline" />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="editBudget">Budget</label>
          <input id="editBudget" type="text" class="form-control" formControlName="budget" />
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="button" class="btn btn-outline-secondary" (click)="cancelEdit()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="isSaving">
          {{ isSaving ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>
    </form>
  </section>

  <div class="modal fade" [ngClass]="{ show: showDeleteModal }" [style.display]="showDeleteModal ? 'block' : 'none'" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete Client</h5>
          <button type="button" class="btn-close" (click)="cancelDelete()"></button>
        </div>
        <div class="modal-body">Are you sure you want to delete this client?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" (click)="cancelDelete()">Cancel</button>
          <button type="button" class="btn btn-danger" (click)="deleteConfirmed()" [disabled]="isDeleting">
            {{ isDeleting ? 'Deleting...' : 'Delete' }}
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade" [ngClass]="{ show: showDeleteModal }" *ngIf="showDeleteModal"></div>
</main>
