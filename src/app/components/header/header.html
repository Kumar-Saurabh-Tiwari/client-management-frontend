<header class="app-header">
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid app-nav-wrap">
            <a class="navbar-brand" routerLink="/clients">Client Manager</a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item" *ngIf="isAuthenticated()">
                        <a class="nav-link" routerLink="/clients">Clients</a>
                    </li>

                    <li class="nav-item" *ngIf="!isAuthenticated()">
                        <a class="nav-link" routerLink="/login">Login</a>
                    </li>

                    <li class="nav-item" *ngIf="!isAuthenticated()">
                        <a class="nav-link" routerLink="/register">Register</a>
                    </li>

                    <li class="nav-item user-label" *ngIf="isAuthenticated() && userName()">
                        Hi, {{ userName() }}
                    </li>

                    <li class="nav-item" *ngIf="isAuthenticated()">
                        <button class="btn btn-sm btn-outline-light" (click)="logout()">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
